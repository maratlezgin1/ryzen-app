<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Ryzen VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0A1633;       /* background: the tiger's room at night */
    --deep: #071027;        /* tab bar, wells */
    --panel: #10204A;       /* raised surfaces */
    --line: #1E3266;        /* dividers, tracks */
    --neon: #3D8BFF;        /* protection, primary actions */
    --neon-soft: rgba(61, 139, 255, 0.16);
    --amber: #F2A03D;       /* prices and rewards — the tiger's fur */
    --ember: #FF5B3A;       /* expired */
    --ice: #EAF1FF;         /* text */
    --steel: #8A9BC4;       /* secondary text */
    --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
    --body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --tabs-h: 64px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ice); }
  body {
    font: 400 16px/1.5 var(--body);
    min-height: 100vh;
    padding-bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px) + 16px);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .view[hidden] { display: none; }
  h2 { font: 700 22px/1.25 var(--display); margin: 28px 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; }
  .muted { color: var(--steel); }
  .small { font-size: 14px; line-height: 1.45; }

  /* ---------- buttons ---------- */
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 52px; padding: 12px 20px;
    border-radius: 999px; border: 1px solid transparent;
    font-weight: 600; font-size: 16px;
    transition: transform .12s ease, background-color .12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--neon); color: #fff; box-shadow: 0 8px 28px rgba(61, 139, 255, 0.35); }
  .btn-amber { background: var(--amber); color: #2A1500; box-shadow: 0 8px 28px rgba(242, 160, 61, 0.28); }
  .btn-ghost { background: transparent; border-color: var(--line); color: var(--ice); }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stack { display: grid; gap: 10px; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  /* ---------- home ---------- */
  .wordmark {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: 18px; font: 800 15px/1 var(--display); letter-spacing: 0.02em;
  }
  .wordmark small { font: 500 13px/1 var(--body); color: var(--steel); letter-spacing: 0; }
  .emblem { position: relative; width: 236px; height: 236px; margin: 22px auto 6px; }
  .emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .emblem .track { stroke: var(--line); }
  .emblem .arc { stroke: var(--ring, var(--neon)); stroke-linecap: round; filter: drop-shadow(0 0 6px var(--ring, var(--neon))); }
  .emblem .ticks { stroke: rgba(234, 241, 255, 0.18); }
  .emblem img {
    position: absolute; inset: 30px; width: 176px; height: 176px; border-radius: 50%;
    object-fit: cover; border: 2px solid var(--deep);
  }
  .emblem.off img { filter: grayscale(0.85) brightness(0.7); }
  .state { text-align: center; font: 600 17px/1.3 var(--body); margin: 8px 0 2px; color: var(--ring, var(--neon)); }
  .days { text-align: center; margin: 0; }
  .days .num { font: 800 64px/1 var(--display); letter-spacing: -0.03em; }
  .days .unit { font: 500 18px/1 var(--body); color: var(--steel); margin-left: 6px; }
  .until { text-align: center; color: var(--steel); font-size: 15px; margin: 8px 0 22px; }
  .emblem.off + .state { margin-top: 14px; }
  .facts { margin: 22px 0 0; padding: 4px 0; border-top: 1px solid var(--line); }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .facts dt { color: var(--steel); }
  .facts dd { margin: 0; font-weight: 600; text-align: right; }
  .demo { margin: 14px 0 0; padding: 10px 14px; border-radius: 14px; background: var(--neon-soft); color: var(--ice); font-size: 14px; }

  /* ---------- plans ---------- */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; margin: 14px 0 12px;
         background: var(--deep); border: 1px solid var(--line); border-radius: 999px; }
  .seg button { border: 0; background: transparent; padding: 10px 8px; border-radius: 999px; font-weight: 600; color: var(--steel); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ice); box-shadow: inset 0 0 0 1px var(--line); }
  .offer { margin: 6px 0 14px; padding: 12px 16px; border-radius: 16px; border: 1px solid rgba(242, 160, 61, 0.45);
           background: rgba(242, 160, 61, 0.08); color: var(--amber); font-weight: 600; font-size: 15px; }
  .plans { list-style: none; margin: 0; padding: 0; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .plans li + li { border-top: 1px solid var(--line); }
  .plan { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%;
          padding: 16px 18px; border: 0; background: transparent; text-align: left; }
  .plan .term { font: 700 20px/1.2 var(--display); letter-spacing: -0.01em; }
  .plan .sub { grid-column: 1; color: var(--steel); font-size: 14px; }
  .plan .price { grid-row: 1 / span 2; grid-column: 2; text-align: right; font: 700 20px/1.2 var(--display); color: var(--amber); }
  .plan .price s { display: block; font: 500 13px/1.2 var(--body); color: var(--steel); }
  .plan .best { display: block; color: var(--amber); font-weight: 600; }
  .buy { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .buy > div { overflow: hidden; padding: 0 18px; }
  li.open .buy { grid-template-rows: 1fr; }
  li.open .buy > div { padding-bottom: 16px; }
  li.open { background: rgba(61, 139, 255, 0.06); }

  /* ---------- friends ---------- */
  .score { display: flex; align-items: baseline; gap: 10px; margin: 16px 0 6px; }
  .score .num { font: 800 56px/1 var(--display); color: var(--amber); letter-spacing: -0.03em; }
  .ladder { list-style: none; margin: 18px 0 22px; padding: 0; position: relative; }
  .ladder li { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px;
               padding: 12px 0 12px 40px; }
  .ladder li::before { /* the track */
    content: ''; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: var(--line);
  }
  .ladder li:first-child::before { top: 50%; }
  .ladder li:last-child::before { bottom: 50%; }
  .ladder li.done::before, .ladder li.reached-next::before { background: var(--neon); }
  .ladder .dot { position: absolute; left: 3px; width: 18px; height: 18px; border-radius: 50%;
                 background: var(--night); border: 2px solid var(--line); }
  .ladder li.done .dot { background: var(--neon); border-color: var(--neon); box-shadow: 0 0 10px var(--neon); }
  .ladder li.next .dot { border-color: var(--amber); }
  .ladder .who { font-weight: 600; }
  .ladder .gain { font: 700 16px/1 var(--display); color: var(--amber); white-space: nowrap; }
  .ladder li:not(.done) .gain { opacity: 0.75; }
  .ladder .left { display: block; font-size: 13px; color: var(--amber); font-weight: 500; }

  /* ---------- help ---------- */
  .steps { list-style: none; counter-reset: step; margin: 6px 0 18px; padding: 0; }
  .steps li { counter-increment: step; position: relative; padding: 12px 0 12px 44px; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 10px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font: 700 14px/1 var(--display); color: var(--neon); border: 1.5px solid var(--neon);
  }
  .steps .btn { margin-top: 10px; min-height: 44px; }
  .hint { padding: 14px 16px; border-radius: 16px; background: var(--deep); border: 1px solid var(--line); font-size: 14px; margin-bottom: 18px; }

  /* ---------- tab bar ---------- */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(4, 1fr);
    height: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(7, 16, 39, 0.94); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .tabs button { border: 0; background: transparent; color: var(--steel); display: grid; place-items: center; align-content: center; gap: 3px; font-size: 12px; font-weight: 500; }
  .tabs svg { width: 24px; height: 24px; }
  .tabs button[aria-selected="true"] { color: var(--ice); }
  .tabs button[aria-selected="true"] svg { color: var(--neon); filter: drop-shadow(0 0 6px rgba(61, 139, 255, 0.7)); }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 18px); transform: translate(-50%, 20px); opacity: 0;
           max-width: 88vw; padding: 10px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
           font-size: 14px; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 6; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<main>
  <section class="view" id="v-home" aria-label="Главная"></section>
  <section class="view" id="v-plans" aria-label="Тарифы" hidden></section>

    Тарифы
  </button>
  <button role="tab" data-tab="friends" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16.2 14.3c2.3-.3 4 1.2 4.4 4"/></svg>

  </button>
  <button role="tab" data-tab="help" aria-selected="false">

    Помощь
  </button>
</nav>

        actions = soon || s.t
          ? '<button class="btn btn-primary" data-tab-go="plans">' + (s.t ? 'Купить подписку' : 'Продлить подписку') + '</button>' +
            '<div class="btn-row"><button class="btn btn-ghost" data-bot="connect">Подключить</button><button class="btn btn-ghost" data-bot="qr">QR-код</button></div>'
          : '<button class="btn btn-primary" data-bot="connect">Подключить устройство</button>' +
            '<div class="btn-row"><button class="btn btn-ghost" data-tab-go="plans">' + renewBtn + '</button><button class="btn btn-ghost" data-bot="qr">QR-код</button></div>';
      }
    }
    var ticks = '';
    for (var i = 0; i < 60; i++) {
      var a = (i / 60) * 2 * Math.PI, r1 = 116, r2 = i % 5 === 0 ? 110 : 113;
      ticks += '<line x1="' + (118 + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (118 + r1 * Math.sin(a)).toFixed(1) +
        '" x2="' + (118 + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (118 + r2 * Math.sin(a)).toFixed(1) + '"/>';
    }
    var facts = '';
    if (s) {
      facts = '<dl class="facts">' +
        '<div><dt>Тариф</dt><dd>' + esc(s.t ? 'Пробный период' : s.p || '—') + '</dd></div>' +
        '<div><dt>Трафик</dt><dd>' + (s.g > 0 ? esc(s.g) + ' ГБ на весь срок' : 'без ограничений') + '</dd></div>' +
        '<div><dt>Устройства</dt><dd>' + (s.d > 0 ? 'до ' + esc(s.d) : 'без ограничений') + '</dd></div>' +
        '</dl>';
    }
    document.getElementById('v-home').innerHTML =
      '<div class="wordmark">Ryzen VPN<small>' + (inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user ? esc(tg.initDataUnsafe.user.first_name || '') : '') + '</small></div>' +
      '<div class="emblem' + (off ? ' off' : '') + '" style="--ring:' + ring + '">' +
        '<svg viewBox="0 0 236 236" aria-hidden="true">' +
          '<g class="ticks" stroke-width="1.4">' + ticks + '</g>' +
          '<circle class="track" cx="118" cy="118" r="104" fill="none" stroke-width="7"/>' +
          '<circle class="arc" id="arc" cx="118" cy="118" r="104" fill="none" stroke-width="7" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '"/>' +
        '</svg>' +
        '<img src="' + TIGER + '" alt="Тигр Ryzen VPN">' +
      '</div>' +
      '<p class="state" style="--ring:' + ring + '">' + esc(state) + '</p>' +
      (off ? '' : '<p class="days"><span class="num">' + esc(big) + '</span><span class="unit">' + esc(unit) + '</span></p>') +
      '<p class="until">' + esc(until) + '</p>' +
      '<div class="stack">' + actions + '</div>' +
      facts +
      (demo ? '<p class="demo">Это пример. Откройте приложение в Telegram кнопкой внизу слева в чате с ботом — здесь появится ваша подписка.</p>' : '');
    // The one orchestrated moment: the ring fills up to the days left.
    var arc = document.getElementById('arc');
    var target = (C * (1 - frac)).toFixed(1);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      arc.setAttribute('stroke-dashoffset', target);
    } else {
      arc.style.transition = 'stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)';
      requestAnimationFrame(function () { requestAnimationFrame(function () { arc.setAttribute('stroke-dashoffset', target); }); });
    }
  }

  // ---------- plans ----------
  var giftMode = false;
  var openPlan = null;
  function renderPlans() {
    var plans = (data.pl || []).map(function (p) { return { id: p[0], name: p[1], days: p[2], price: p[3], gb: p[4], dev: p[5] }; });
    var dc = !giftMode && data.dc && data.dc[1] > Date.now() / 1000 ? { pct: data.dc[0], until: data.dc[1] } : null;
    var price = function (p) { return dc ? Math.max(1, Math.round(p.price * (100 - dc.pct) / 100)) : p.price; };
    var bestId = null, bestPer = Infinity;
    plans.forEach(function (p) { var per = p.price / (p.days / 30); if (plans.length > 1 && per < bestPer) { bestPer = per; bestId = p.id; } });
    var same = plans.length && plans.every(function (p) { return p.gb === plans[0].gb && p.dev === plans[0].dev; });
    var rows = plans.map(function (p) {
      var months = p.days / 30;
      var per = months >= 2 ? Math.round(price(p) / months) + ' ⭐ в месяц' : '';
      var sub = [p.name];
      if (per) sub.push(per);
      if (!same) sub.push((p.gb > 0 ? p.gb + ' ГБ' : 'без лимита') + ', ' + (p.dev > 0 ? 'до ' + p.dev + ' устр.' : 'устройств без лимита'));
      var isOpen = openPlan === p.id;
      return '<li class="' + (isOpen ? 'open' : '') + '">' +
        '<button class="plan" data-plan="' + esc(p.id) + '" aria-expanded="' + isOpen + '">' +
          '<span class="term">' + esc(p.days) + ' ' + plural(p.days, 'день', 'дня', 'дней') + '</span>' +
          '<span class="price">' + (dc ? '<s>' + esc(p.price) + ' ⭐</s>' : '') + esc(price(p)) + ' ⭐</span>' +
          '<span class="sub">' + esc(sub.join(', ')) + (p.id === bestId ? '<span class="best">Выгоднее всего</span>' : '') + '</span>' +
        '</button>' +
        '<div class="buy"><div>' +
          '<button class="btn ' + (giftMode ? 'btn-amber' : 'btn-primary') + '" data-bot="' + (giftMode ? 'gplan_' : 'plan_') + esc(p.id) + '">' +
            (giftMode ? 'Подарить за ' : 'Оплатить ') + esc(price(p)) + ' ⭐</button>' +
        '</div></div>' +
      '</li>';
    }).join('');
    document.getElementById('v-plans').innerHTML =
      '<h2>Тарифы</h2>' +
      '<div class="seg" role="group" aria-label="Для кого">' +
        '<button data-gift="0" aria-pressed="' + !giftMode + '">Себе</button>' +
        '<button data-gift="1" aria-pressed="' + giftMode + '">В подарок</button>' +
      '</div>' +
      (dc ? '<p class="offer">Ваша скидка ' + esc(dc.pct) + '% действует до ' + esc(shortDate(dc.until)) + '</p>' : '') +
      (same ? '<p class="muted small">В каждом тарифе ' + (plans[0].gb > 0 ? plans[0].gb + ' ГБ трафика на весь срок' : 'трафик без ограничений') +
        ' и ' + (plans[0].dev > 0 ? 'до ' + plans[0].dev + ' ' + plural(plans[0].dev, 'устройства', 'устройств', 'устройств') : 'любое число устройств') + '.</p>' : '') +
      (plans.length ? '<ul class="plans">' + rows + '</ul>' : '<p class="muted">Сейчас нет доступных тарифов. Загляните чуть позже.</p>') +
      '<p class="muted small" style="margin-top:14px">' +
        (giftMode ? 'После оплаты бот пришлёт ссылку — отправьте её другу, и он активирует подписку. Ссылка работает один раз.'
                  : (data.s && data.s.a ? 'Дни и трафик прибавятся к текущей подписке, ссылка останется прежней.' : 'Ссылка подписки придёт в чат сразу после оплаты.')) +
        ' Оплата звёздами Telegram в чате с ботом.</p>';
  }

  // ---------- friends ----------
  function renderFriends() {
    var r = data.r;
    var el = document.getElementById('v-friends');
    if (!r) {
      el.innerHTML = '<h2>Друзья</h2><p class="muted">Реферальная программа сейчас не действует. Загляните позже.</p>';
      return;
    }
    var nextIndex = -1;
    for (var i = 0; i < r.l.length; i++) if (r.c < r.l[i][0]) { nextIndex = i; break; }
    var steps = r.l.map(function (st, i) {
      var done = r.c >= st[0];
      var cls = done ? 'done' : i === nextIndex ? 'next' : '';
      if (done && i + 1 < r.l.length && r.c >= r.l[i + 1][0]) cls += ' reached-next';
      var leftTxt = i === nextIndex ? '<span class="left">ещё ' + (st[0] - r.c) + ' ' + plural(st[0] - r.c, 'друг', 'друга', 'друзей') + '</span>' : '';
      return '<li class="' + cls + '"><span class="dot" aria-hidden="true"></span>' +
        '<span class="who">' + st[0] + ' ' + plural(st[0], 'друг', 'друга', 'друзей') + leftTxt + '</span>' +
        '<span class="gain">+' + st[1] + ' ' + plural(st[1], 'день', 'дня', 'дней') + '</span></li>';
    }).join('');
    el.innerHTML =
      '<h2>Друзья</h2>' +
      '<p class="muted small">Друг засчитывается, когда перейдёт по вашей ссылке и подпишется на наш канал. Награды складываются.</p>' +
      '<div class="score"><span class="num">' + esc(r.c) + '</span><span>' + plural(r.c, 'друг засчитан', 'друга засчитано', 'друзей засчитано') + '</span></div>' +
      '<ol class="ladder">' + steps + '</ol>' +
      '<div class="stack">' +
        '<button class="btn btn-primary" data-share="1">Пригласить друга</button>' +
        (r.w > 0 ? '<button class="btn btn-amber" data-bot="ref">Забрать +' + esc(r.w) + ' ' + plural(r.w, 'день', 'дня', 'дней') + '</button>' : '') +
        '<button class="btn btn-ghost" data-bot="reftop">Топ рефералов</button>' +
      '</div>';
  }

  // ---------- help ----------
  var device = /android/i.test(navigator.userAgent) ? 'android' : /windows/i.test(navigator.userAgent) ? 'windows' : /macintosh/i.test(navigator.userAgent) && !('ontouchend' in document) ? 'mac' : 'ios';
  function renderHelp() {
    var names = { ios: 'iPhone', android: 'Android', windows: 'Windows', mac: 'Mac' };
    var install = {
      ios: '<p>Установите приложение Happ из App Store.</p><button class="btn btn-ghost" data-url="' + LINKS.ios + '">Открыть App Store</button>',
      android: '<p>Установите приложение Happ из Google Play или скачайте файл APK.</p><div class="btn-row"><button class="btn btn-ghost" data-url="' + LINKS.android + '">Google Play</button><button class="btn btn-ghost" data-url="' + LINKS.androidApk + '">Файл APK</button></div>',
      windows: '<p>Скачайте и установите Happ для Windows.</p><button class="btn btn-ghost" data-url="' + LINKS.windows + '">Скачать для Windows</button>',
      mac: '<p>Скачайте и установите Happ для Mac.</p><button class="btn btn-ghost" data-url="' + LINKS.mac + '">Скачать для Mac</button>'
    };
    document.getElementById('v-help').innerHTML =
      '<h2>Как подключиться</h2>' +
      '<div class="seg" role="group" aria-label="Устройство">' +
        ['ios', 'android', 'windows', 'mac'].map(function (k) { return '<button data-device="' + k + '" aria-pressed="' + (device === k) + '">' + names[k] + '</button>'; }).join('') +
      '</div>' +
      '<ol class="steps">' +
        '<li>' + install[device] + '</li>' +
        '<li><p>Скопируйте свою ссылку подписки — бот пришлёт её в чат. С другого устройства удобнее отсканировать QR-код.</p>' +
          '<div class="btn-row"><button class="btn btn-ghost" data-bot="mysub">Моя ссылка</button><button class="btn btn-ghost" data-bot="qr">QR-код</button></div></li>' +
        '<li><p>Откройте Happ, нажмите «+» и добавьте подписку из буфера обмена. Затем нажмите кнопку включения.</p></li>' +
      '</ol>' +
      (device === 'ios' ? '<div class="hint">В российском App Store приложения Happ нет. Смените регион Apple ID — бот покажет, как это сделать по шагам.' +
        '<button class="btn btn-ghost" style="margin-top:12px;min-height:44px" data-bot="guide_region">Как сменить регион</button></div>' : '') +
      '<div class="stack">' +
        '<button class="btn btn-ghost" data-url="https://t.me/' + esc(SUPPORT) + '">Написать в поддержку</button>' +
        '<button class="btn btn-ghost" data-bot="docs">Документы</button>' +
      '</div>';
  }

  // ---------- navigation ----------
  var current = 'home';
  var rendered = {};
  var renderers = { home: renderHome, plans: renderPlans, friends: renderFriends, help: renderHelp };
  function go(tab) {
    current = tab;
    Object.keys(renderers).forEach(function (k) {
      document.getElementById('v-' + k).hidden = k !== tab;
    });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    if (!rendered[tab] || tab !== 'home') { renderers[tab](); rendered[tab] = true; }
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button');
    if (!t) return;
    if (t.dataset.tab) { haptic('light'); go(t.dataset.tab); return; }
    if (t.dataset.tabGo) { haptic('light'); go(t.dataset.tabGo); return; }
    if (t.dataset.plan) {
      haptic('light');
      openPlan = openPlan === t.dataset.plan ? null : t.dataset.plan;
      var li = t.parentNode;
      document.querySelectorAll('.plans li').forEach(function (x) { if (x !== li) { x.classList.remove('open'); x.querySelector('.plan').setAttribute('aria-expanded', 'false'); } });
      li.classList.toggle('open', openPlan === t.dataset.plan);
      t.setAttribute('aria-expanded', String(openPlan === t.dataset.plan));
      return;
    }
    if (t.dataset.gift !== undefined) { haptic('light'); giftMode = t.dataset.gift === '1'; openPlan = null; renderPlans(); return; }
    if (t.dataset.device) { haptic('light'); device = t.dataset.device; renderHelp(); return; }
    if (t.dataset.url) { openUrl(t.dataset.url); return; }
    if (t.dataset.share) {
      var id = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
      if (!id) { toast('Ссылка для друзей — в разделе «Реферальная программа» в боте'); return; }
      var link = 'https://t.me/' + BOT + '?start=ref_' + id;
      haptic('medium');
      tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Пользуюсь Ryzen VPN — попробуй и ты 👇'));
      return;
    }
    if (t.dataset.bot) { toBot(t.dataset.bot); }
  });

  function start() {
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.setHeaderColor) tg.setHeaderColor('#0A1633');
        if (tg.setBackgroundColor) tg.setBackgroundColor('#0A1633');
        if (tg.setBottomBarColor) tg.setBottomBarColor('#071027');
      } catch (e) {}
    }
    var first = params.get('tab');
    go(renderers[first] ? first : 'home');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
